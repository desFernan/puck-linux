[package]
name = "puck-linux"
version = "0.1.1"
edition = "2021"

[dependencies]
gtk4 = "0.9"
gdk4-x11 = "0.9"
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
async-channel = "2"

[dev-dependencies]
tempfile = "3"
